{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Web Security Academy (Learning){% endblock %}</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --card:#1e293b; --line:#334155;
      --text:#e2e8f0; --muted:#94a3b8;
      --before:#ef4444; --before-bg:#3f1d1d;
      --after:#22c55e; --after-bg:#14321f;
      --accent:#38bdf8;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
      background:var(--bg);color:var(--text);line-height:1.7}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    header.site{background:var(--panel);border-bottom:1px solid var(--line);
      padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
    header.site .logo{font-weight:700;font-size:18px}
    header.site .logo span{color:var(--accent)}
    header.site .warn{margin-left:auto;font-size:12px;color:#fca5a5;
      border:1px solid #7f1d1d;background:#2a1414;padding:4px 10px;border-radius:6px}
    main{max-width:1080px;margin:0 auto;padding:28px 24px 64px}
    h1{font-size:26px;margin:0 0 6px}
    h2{font-size:20px;border-left:4px solid var(--accent);padding-left:10px;margin:32px 0 14px}
    h3{font-size:16px;margin:20px 0 8px}
    .muted{color:var(--muted)}
    .crumb{font-size:13px;color:var(--muted);margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
    .card h3{margin-top:0}
    .cat{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:.02em;margin:26px 0 10px;
      font-weight:700}
    .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
    .badge.lv{color:var(--muted)}
    .tag-before{color:var(--before);border:1px solid var(--before);background:var(--before-bg);
      padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}
    .tag-after{color:var(--after);border:1px solid var(--after);background:var(--after-bg);
      padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
    @media(max-width:820px){.cols{grid-template-columns:1fr}}
    .panel{border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .panel .head{padding:10px 14px;font-weight:700;font-size:13px}
    .panel.before .head{background:var(--before-bg);color:#fca5a5;border-bottom:1px solid var(--before)}
    .panel.after .head{background:var(--after-bg);color:#86efac;border-bottom:1px solid var(--after)}
    .panel .body{padding:14px}
    pre{background:#0b1222;border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;
      font-family:"Consolas","SFMono-Regular",monospace;font-size:12.5px;line-height:1.55;color:#cbd5e1}
    .btn{display:inline-block;padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px;
      border:1px solid var(--line);background:#0b1222;color:var(--text)}
    .btn:hover{text-decoration:none;border-color:var(--accent)}
    .btn.before{border-color:var(--before);color:#fecaca}
    .btn.after{border-color:var(--after);color:#bbf7d0}
    input[type=text],input[type=password],input[type=search]{
      width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
      background:#0b1222;color:var(--text);font-size:14px}
    form .row{margin-bottom:10px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
    th{background:#0b1222;color:var(--muted)}
    .note{background:#0b1222;border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:13px;color:var(--muted)}
    .msg{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
    .msg.ok{background:var(--after-bg);border:1px solid var(--after);color:#bbf7d0}
    .msg.ng{background:var(--before-bg);border:1px solid var(--before);color:#fecaca}
    .draft{background:#2a1f05;border:1px solid #a16207;color:#fde68a;border-radius:8px;
      padding:10px 14px;font-size:13px;margin-bottom:16px}
    .result{background:#0b1222;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px}
  </style>
</head>
<body>
  <header class="site">
    <a class="logo" href="{% url 'index' %}">Web Security <span>Academy</span></a>
    <span class="muted" style="font-size:12px">Learn: before and after the fix</span>
    <a class="btn" href="{% url 'chatbot' %}" style="margin-left:auto">✦ AI Assistant</a>
    <span class="warn" style="margin-left:0">⚠ Local only / Do not put online</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

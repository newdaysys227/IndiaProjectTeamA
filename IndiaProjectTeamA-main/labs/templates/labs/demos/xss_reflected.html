{% extends "labs/demos/_demo_base.html" %}
{% block demo %}
  <form method="get">
    <div class="row">
      <label>Search word</label>
      <input type="search" name="q" value="{{ q }}" placeholder="for example: <script>alert(1)</script>">
    </div>
    <button class="btn {{ mode }}" type="submit">Search</button>
  </form>

  {% if searched %}
    <div class="result">
      <h3>Result</h3>
      {{ snippet|safe }}
      {% if mode == 'before' %}
        <p class="muted" style="font-size:13px;margin-top:10px">
          If you see the alert box, your script ran on the page.</p>
      {% else %}
        <p class="muted" style="font-size:13px;margin-top:10px">
          The tag is shown as text. The script does not run.</p>
      {% endif %}
    </div>
  {% endif %}
{% endblock %}

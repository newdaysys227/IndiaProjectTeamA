{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Web Security Academy (Learning){% endblock %}</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --card:#1e293b; --line:#334155;
      --text:#e2e8f0; --muted:#94a3b8;
      --before:#ef4444; --before-bg:#3f1d1d;
      --after:#22c55e; --after-bg:#14321f;
      --accent:#38bdf8;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
      background:var(--bg);color:var(--text);line-height:1.7}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    header.site{background:var(--panel);border-bottom:1px solid var(--line);
      padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
    header.site .logo{font-weight:700;font-size:18px}
    header.site .logo span{color:var(--accent)}
    header.site .warn{margin-left:auto;font-size:12px;color:#fca5a5;
      border:1px solid #7f1d1d;background:#2a1414;padding:4px 10px;border-radius:6px}
    main{max-width:1080px;margin:0 auto;padding:28px 24px 64px}
    h1{font-size:26px;margin:0 0 6px}
    h2{font-size:20px;border-left:4px solid var(--accent);padding-left:10px;margin:32px 0 14px}
    h3{font-size:16px;margin:20px 0 8px}
    .muted{color:var(--muted)}
    .crumb{font-size:13px;color:var(--muted);margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
    .card h3{margin-top:0}
    .cat{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:.02em;margin:26px 0 10px;
      font-weight:700}
    .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
    .badge.lv{color:var(--muted)}
    .tag-before{color:var(--before);border:1px solid var(--before);background:var(--before-bg);
      padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}
    .tag-after{color:var(--after);border:1px solid var(--after);background:var(--after-bg);
      padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
    @media(max-width:820px){.cols{grid-template-columns:1fr}}
    .panel{border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .panel .head{padding:10px 14px;font-weight:700;font-size:13px}
    .panel.before .head{background:var(--before-bg);color:#fca5a5;border-bottom:1px solid var(--before)}
    .panel.after .head{background:var(--after-bg);color:#86efac;border-bottom:1px solid var(--after)}
    .panel .body{padding:14px}
    pre{background:#0b1222;border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;
      font-family:"Consolas","SFMono-Regular",monospace;font-size:12.5px;line-height:1.55;color:#cbd5e1}
    .btn{display:inline-block;padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px;
      border:1px solid var(--line);background:#0b1222;color:var(--text)}
    .btn:hover{text-decoration:none;border-color:var(--accent)}
    .btn.before{border-color:var(--before);color:#fecaca}
    .btn.after{border-color:var(--after);color:#bbf7d0}
    input[type=text],input[type=password],input[type=search]{
      width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);
      background:#0b1222;color:var(--text);font-size:14px}
    form .row{margin-bottom:10px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
    th{background:#0b1222;color:var(--muted)}
    .note{background:#0b1222;border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:13px;color:var(--muted)}
    .msg{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}
    .msg.ok{background:var(--after-bg);border:1px solid var(--after);color:#bbf7d0}
    .msg.ng{background:var(--before-bg);border:1px solid var(--before);color:#fecaca}
    .draft{background:#2a1f05;border:1px solid #a16207;color:#fde68a;border-radius:8px;
      padding:10px 14px;font-size:13px;margin-bottom:16px}
    .result{background:#0b1222;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:12px}

    /* ── フローティング チャットウィジェット ── */
    #chat-widget{position:fixed;bottom:24px;right:24px;z-index:9999;font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
    #chat-toggle-btn{
      width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
      background:linear-gradient(135deg,#38bdf8,#6366f1);
      color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 16px rgba(56,189,248,.45);
      transition:transform .2s,box-shadow .2s;
    }
    #chat-toggle-btn:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(56,189,248,.6)}
    #chat-window{
      display:none;flex-direction:column;
      width:360px;height:500px;
      background:#111827;border:1px solid #334155;border-radius:16px;
      box-shadow:0 8px 32px rgba(0,0,0,.6);
      overflow:hidden;margin-bottom:12px;
    }
    #chat-window.open{display:flex}
    #chat-header{
      background:linear-gradient(90deg,#1e40af,#4f46e5);
      padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
      flex-shrink:0;
    }
    #chat-header .title{font-weight:700;font-size:14px;color:#fff;display:flex;align-items:center;gap:8px}
    #chat-header .title::before{content:"🤖"}
    #chat-close-btn{background:none;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
    #chat-close-btn:hover{color:#fff}
    #chat-clear-btn{background:none;border:none;color:#94a3b8;font-size:11px;cursor:pointer;padding:2px 8px;
      border:1px solid #334155;border-radius:6px;transition:color .15s,border-color .15s}
    #chat-clear-btn:hover{color:#f87171;border-color:#f87171}
    #chat-messages{
      flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;
      scrollbar-width:thin;scrollbar-color:#334155 #111827;
    }
    #chat-messages::-webkit-scrollbar{width:5px}
    #chat-messages::-webkit-scrollbar-track{background:#111827}
    #chat-messages::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
    .chat-bubble{max-width:88%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
    .chat-bubble.user{background:#1e40af;color:#dbeafe;align-self:flex-end;border-bottom-right-radius:3px}
    .chat-bubble.bot{background:#1e293b;color:#e2e8f0;align-self:flex-start;border-bottom-left-radius:3px;border:1px solid #334155}
    .chat-bubble.error{background:#3f1d1d;color:#fca5a5;align-self:flex-start;border:1px solid #ef4444;border-bottom-left-radius:3px}
    .chat-bubble.thinking{background:#1e293b;color:#64748b;align-self:flex-start;border:1px dashed #334155;font-style:italic;animation:pulse 1.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    #chat-input-area{
      display:flex;gap:8px;padding:10px 12px;
      border-top:1px solid #334155;background:#0f172a;flex-shrink:0;
    }
    #chat-input{
      flex:1;padding:8px 12px;border-radius:8px;border:1px solid #334155;
      background:#1e293b;color:#e2e8f0;font-size:13px;resize:none;
      font-family:inherit;line-height:1.4;outline:none;
    }
    #chat-input:focus{border-color:#38bdf8}
    #chat-send-btn{
      padding:8px 14px;background:linear-gradient(135deg,#38bdf8,#6366f1);
      border:none;border-radius:8px;color:#fff;font-weight:700;font-size:13px;
      cursor:pointer;white-space:nowrap;transition:opacity .15s;
    }
    #chat-send-btn:disabled{opacity:.5;cursor:not-allowed}
  </style>
</head>
<body>
  <header class="site">
    <a class="logo" href="{% url 'index' %}">Web Security <span>Academy</span></a>
    <span class="muted" style="font-size:12px">Learn: before and after the fix</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ── フローティング チャットウィジェット ── -->
  <div id="chat-widget">
    <div id="chat-window">
      <div id="chat-header">
        <span class="title">AI Security Assistant</span>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="chat-provider-select" title="Choose AI Provider" style="background:#0b1222;color:#38bdf8;border:1px solid #334155;border-radius:6px;font-size:11px;padding:3px 6px;cursor:pointer;">
            <option value="groq" selected>⚡ Groq (Fast ~1s)</option>
            <option value="gemini">✨ Gemini 3.8 Flash</option>
          </select>
          <button id="chat-clear-btn" title="Clear history">🗑 Clear</button>
          <button id="chat-close-btn" title="Close">✕</button>
        </div>
      </div>
      <div id="chat-messages">
        <div class="chat-bubble bot">Hello! Ask me anything about web security 🔐</div>
      </div>
      <div id="chat-input-area">
        <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Type your question… (Enter to send)"></textarea>
        <button id="chat-send-btn">Send</button>
      </div>
    </div>
    <button id="chat-toggle-btn" title="Open AI Chat">💬</button>
  </div>

  <script>
  (function(){
    'use strict';

    const STORAGE_KEY = 'chatbot_history_v1';
    const API_URL     = '{% url "chatbot_api" %}';
    const CSRF_TOKEN  = '{{ csrf_token }}';

    const widget    = document.getElementById('chat-widget');
    const toggleBtn = document.getElementById('chat-toggle-btn');
    const closeBtn  = document.getElementById('chat-close-btn');
    const clearBtn  = document.getElementById('chat-clear-btn');
    const providerSel = document.getElementById('chat-provider-select');
    const chatWin   = document.getElementById('chat-window');
    const messages  = document.getElementById('chat-messages');
    const input     = document.getElementById('chat-input');
    const sendBtn   = document.getElementById('chat-send-btn');

    // ── 履歴管理 ──────────────────────────────
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch(e) { return []; }
    }
    function saveHistory(hist) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(hist.slice(-60))); }
      catch(e) {}
    }

    // ── バブル描画 ──────────────────────────────
    function addBubble(role, text, meta) {
      const div = document.createElement('div');
      div.className = 'chat-bubble ' + role;
      div.textContent = text;
      if (meta) {
        const metaDiv = document.createElement('div');
        metaDiv.style.fontSize = '10px';
        metaDiv.style.marginTop = '6px';
        metaDiv.style.opacity = '0.85';
        if (meta.guardrail_triggered) {
          metaDiv.style.color = '#f87171';
          metaDiv.textContent = '🛡️ Guardrail: ' + (meta.guardrail_type || 'Triggered');
        } else if (meta.provider && meta.latency !== undefined) {
          const icon = meta.provider.toLowerCase().includes('groq') ? '⚡ ' : '✨ ';
          metaDiv.textContent = icon + meta.provider + ' • ' + meta.latency + 's';
        }
        div.appendChild(metaDiv);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }
    function addThinking() {
      const div = document.createElement('div');
      div.className = 'chat-bubble thinking';
      div.textContent = 'Thinking…';
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // ── 履歴を画面に復元 ──────────────────────────
    function renderHistory() {
      const hist = loadHistory();
      hist.forEach(function(item){
        addBubble(item.role, item.text, item.meta);
      });
    }

    // ── 送信処理（非同期） ──────────────────────────
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = '';
      sendBtn.disabled = true;

      const hist = loadHistory();

      // ユーザーバブル
      addBubble('user', text);
      hist.push({role:'user', text:text});

      // ローディング表示
      const thinking = addThinking();

      try {
        const provider = providerSel ? providerSel.value : 'groq';
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': CSRF_TOKEN,
          },
          body: JSON.stringify({message: text, provider: provider}),
        });

        const data = await res.json();

        thinking.remove();

        if (!res.ok || data.error) {
          addBubble('error', '❌ ' + (data.error || 'An error occurred.'));
        } else {
          const meta = {
            provider: data.provider,
            latency: data.latency,
            guardrail_triggered: data.guardrail_triggered,
            guardrail_type: data.guardrail_type
          };
          addBubble('bot', data.answer, meta);
          hist.push({role:'bot', text: data.answer, meta: meta});
          saveHistory(hist);
        }
      } catch(e) {
        thinking.remove();
        addBubble('error', '❌ A network error occurred. Please try again.');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // ── イベント ──────────────────────────────
    toggleBtn.addEventListener('click', function(){
      const isOpen = chatWin.classList.contains('open');
      chatWin.classList.toggle('open');
      toggleBtn.textContent = isOpen ? '💬' : '✕';
      if (!isOpen) { input.focus(); }
    });

    closeBtn.addEventListener('click', function(){
      chatWin.classList.remove('open');
      toggleBtn.textContent = '💬';
    });

    clearBtn.addEventListener('click', function(){
      if (!confirm('Clear all chat history?')) return;
      localStorage.removeItem(STORAGE_KEY);
      messages.innerHTML = '<div class="chat-bubble bot">Hello! Ask me anything about web security 🔐</div>';
    });

    sendBtn.addEventListener('click', sendMessage);

    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // textarea の自動高さ調整
    input.addEventListener('input', function(){
      this.style.height = '';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // ── 起動時に履歴を復元 ──────────────────────
    renderHistory();
  })();
  </script>
</body>
</html>
